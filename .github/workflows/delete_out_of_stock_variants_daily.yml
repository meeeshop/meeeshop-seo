name: Delete Out-of-Stock Variants & Under-10 Products Daily

on:
  # 1. Scheduled — runs every day at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * *'

  # 2. Manual dispatch with options
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — simulate only, do not delete anything'
        default: 'false'
        required: false
        type: choice
        options: ['false', 'true']
      min_inventory:
        description: 'Minimum combined inventory threshold to keep product (default: 10)'
        default: '10'
        required: false
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Delete Out-of-Stock Variants & Under-10 Products
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MIN_INVENTORY: ${{ github.event.inputs.min_inventory || '10' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$MIN_INVENTORY" ]; then
            ARGS="$ARGS --min-inventory $MIN_INVENTORY"
          fi
          echo "Executing delete_out_of_stock_variants.py with args: $ARGS"
          python scripts/delete_out_of_stock_variants.py $ARGS

      - name: Upload execution audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: out-of-stock-deletion-logs
          path: logs/delete_out_of_stock_*.json
          retention-days: 30
