name: Weekly Newsletter (Products & Blogs)

on:
  schedule:
    # Runs at 14:00 UTC every Thursday (9:00 AM EST / 10:00 AM EDT)
    # This is a peak engagement time for US women's fashion shoppers.
    - cron: '0 14 * * 4'
  workflow_dispatch:
    # Allows you to trigger the email manually from the Actions tab
    inputs:
      test_email:
        description: 'Send a test email to this address instead of all customers'
        required: false
        type: string
      dry_run:
        description: 'Dry run: Fetch and log customer list without sending'
        required: false
        type: boolean
        default: false

jobs:
  send-weekly-emails:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography python-dotenv
          
      - name: Run Weekly Email Script
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python send_weekly_email.py