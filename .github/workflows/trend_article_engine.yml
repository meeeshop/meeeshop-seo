name: Trend Article Engine

# ─── Triggers ────────────────────────────────────────────────────────────────
on:
  # Manual dispatch: run from GitHub UI with full control over mode/count
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to generate'
        default: '1'
        required: false
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run      # HTML preview only, nothing pushed to Shopify
          - draft        # Save to Shopify as unpublished draft (for review)
          - publish      # Publish live immediately
      from_log:
        description: 'Skip research, use latest cached log (faster)'
        default: 'false'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'
      research_only:
        description: 'Only run research phases (no article generation)'
        default: 'false'
        required: false
        type: choice
        options:
          - 'false'
          - 'true'

  # Scheduled: Mon/Wed/Fri at 9 AM EST — saves as DRAFT so you can review
  schedule:
    - cron: '0 14 * * 1'   # Monday    9 AM EST
    - cron: '0 14 * * 3'   # Wednesday 9 AM EST
    - cron: '0 14 * * 5'   # Friday    9 AM EST

# ─── Job ─────────────────────────────────────────────────────────────────────
jobs:
  trend-article:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ── Install deps ────────────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Build CLI args ───────────────────────────────────────────────────────
      - name: Build CLI arguments
        id: args
        run: |
          MODE="${{ github.event.inputs.mode || 'draft' }}"
          COUNT="${{ github.event.inputs.count || '1' }}"
          FROM_LOG="${{ github.event.inputs.from_log || 'false' }}"
          RESEARCH_ONLY="${{ github.event.inputs.research_only || 'false' }}"

          ARGS="--count $COUNT"

          # Scheduled runs always save as draft (not live publish, not local preview)
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="draft"
          fi

          case "$MODE" in
            dry-run)  ARGS="$ARGS --dry-run" ;;
            publish)  ARGS="$ARGS --publish" ;;
            draft)    ;;   # default: no extra flag = draft mode
          esac

          if [ "$FROM_LOG" = "true" ]; then
            ARGS="$ARGS --from-log"
          fi
          if [ "$RESEARCH_ONLY" = "true" ]; then
            ARGS="$ARGS --research-only"
          fi

          echo "cli_args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"     >> "$GITHUB_OUTPUT"
          echo "count=$COUNT"   >> "$GITHUB_OUTPUT"

      # ── Run engine ──────────────────────────────────────────────────────────
      - name: Run Trend Article Engine
        env:
          PYTHONUTF8: "1"
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Mode  : ${{ steps.args.outputs.mode }}"
          echo "  Count : ${{ steps.args.outputs.count }}"
          echo "  Args  : ${{ steps.args.outputs.cli_args }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          python scripts/trend_article_engine.py ${{ steps.args.outputs.cli_args }}

      # ── Upload artifacts ────────────────────────────────────────────────────
      - name: Upload research logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-research-logs-${{ github.run_number }}
          path: logs/trend_research_*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload dry-run HTML previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-previews-${{ github.run_number }}
          path: logs/preview_*.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload collage images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-collages-${{ github.run_number }}
          path: collage_temp*.jpg
          if-no-files-found: ignore
          retention-days: 14
