name: Google Discover Optimization

on:
  schedule:
    - cron: '0 4 * * 3'  # Every Wednesday at 4:00 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: dry_run | validate_only | fix'
        default: 'dry_run'
        required: false
        type: choice
        options:
          - dry_run
          - validate_only
          - fix

jobs:
  discover-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Discover Optimization
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="dry_run"
          else
            MODE="${{ github.event.inputs.mode || 'dry_run' }}"
          fi
          if [ "$MODE" = "validate_only" ]; then
            python scripts/discover_validator.py --all
          elif [ "$MODE" = "fix" ]; then
            python scripts/discover_fixer.py --limit 5
          else
            python scripts/discover_fixer.py --dry-run --limit 5
          fi
