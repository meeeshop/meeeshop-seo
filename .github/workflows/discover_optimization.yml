name: Google Discover Optimization

on:
  schedule:
    - cron: '0 4 * * 3'  # Every Wednesday at 4:00 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode: fix | dry_run | validate_only'
        default: 'fix'
        required: false
        type: choice
        options:
          - fix
          - dry_run
          - validate_only

jobs:
  discover-opt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Discover Optimization
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          MODE="${{ github.event.inputs.mode || 'fix' }}"
          if [ "$MODE" = "validate_only" ]; then
            python scripts/discover_validator.py --all
          elif [ "$MODE" = "dry_run" ]; then
            python scripts/discover_fixer.py --dry-run --limit 10
          else
            python scripts/discover_fixer.py --limit 10
          fi
