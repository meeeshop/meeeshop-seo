name: MeeeShop Collection SEO & PAA Automation

on:
  schedule:
    - cron: '0 6 * * 0'     # Every Sunday at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Execution action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - diagnose
      collection_handle:
        description: 'Specific Collection handle (optional, e.g. judy-blue-womens-jeans)'
        required: false
        default: ''
        type: string
      force:
        description: 'Force update (ignore 60-day stability lock)'
        required: false
        default: false
        type: boolean

env:
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"

jobs:
  collection_seo:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Collection SEO & PAA Automation
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ARGS=()
          
          if [ "${{ github.event.inputs.action }}" = "diagnose" ]; then
            ARGS+=("--diagnose")
          fi
          
          if [ -n "${{ github.event.inputs.collection_handle }}" ]; then
            ARGS+=("--handle" "${{ github.event.inputs.collection_handle }}")
          fi
          
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS+=("--force")
          fi
          
          echo "Running bulk_update_collection_seo.py ${ARGS[@]}..."
          python scripts/bulk_update_collection_seo.py "${ARGS[@]}"

      - name: Upload backup or preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-seo-report-${{ github.run_number }}
          path: |
            shopify_metafields_backup.json
            category_metafields_log.json
          if-no-files-found: ignore
          retention-days: 30
