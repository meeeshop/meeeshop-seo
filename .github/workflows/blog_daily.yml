name: Blog Daily Generator

on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday  8 AM EST (13:00 UTC)
    - cron: '0 14 * * 6'  # Saturday 9 AM EST (14:00 UTC)
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blog posts to create'
        default: '1'
        required: false
      dry_run:
        description: 'Dry run (no publishing)'
        default: 'false'
        required: false
      publish:
        description: 'Publish immediately (false = save as draft for review)'
        default: 'false'
        required: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate blog post
        env:
          PYTHONUTF8: "1"
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          PUBLISH="${{ github.event.inputs.publish || 'false' }}"
          ARGS="--count $COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          # On scheduled runs, always publish immediately.
          # On manual dispatch, respect the publish input (default: draft for human review).
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$PUBLISH" = "true" ]; then
            ARGS="$ARGS --publish"
          fi
          python scripts/blog_daily.py $ARGS

      - name: Upload blog generation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-generation-${{ github.run_number }}
          path: blog_*.json
          if-no-files-found: ignore
          retention-days: 14
