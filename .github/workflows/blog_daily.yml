name: Blog Daily Generator

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6:00 AM UTC (1:00 AM EST)
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blog posts to create'
        default: '3'
        required: false
      dry_run:
        description: 'Dry run (no publishing)'
        default: 'false'
        required: false
      publish:
        description: 'Publish immediately (false = save as draft for review)'
        default: 'true'
        required: false
      format:
        description: 'Force a specific blog format (default: weighted selection)'
        default: 'default'
        required: false
        type: choice
        options:
          - default
          - sizing_guide
          - outfit_formula
          - buying_guide
          - trend_report
          - care_guide
          - problem_solver

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate blog post
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            COUNT="3"
            PUBLISH="true"
          else
            COUNT="${{ github.event.inputs.count || '3' }}"
            PUBLISH="${{ github.event.inputs.publish || 'true' }}"
          fi
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          FORMAT="${{ github.event.inputs.format || 'default' }}"
          ARGS="--count $COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$PUBLISH" = "true" ]; then
            ARGS="$ARGS --publish"
          fi
          if [ "$FORMAT" != "default" ]; then
            ARGS="$ARGS --format $FORMAT"
          fi
          python scripts/blog_daily.py $ARGS

      - name: Upload previews, collages, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-daily-logs-${{ github.run_number }}
          path: |
            logs/weekly_preview_*.html
            collage_temp*.jpg
            blog_*.json
          if-no-files-found: ignore
          retention-days: 14
