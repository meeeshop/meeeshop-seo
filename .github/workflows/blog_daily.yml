name: Blog Daily Generator

on:
  schedule:
    - cron: '0 13 * * 2'  # Tuesday  8 AM EST (13:00 UTC) — peak weekday morning browse
    - cron: '0 13 * * 4'  # Thursday 8 AM EST (13:00 UTC) — pre-weekend shopping intent
    - cron: '0 14 * * 6'  # Saturday 9 AM EST (14:00 UTC) — highest weekend leisure scroll
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blog posts to create'
        default: '1'
        required: false
      dry_run:
        description: 'Dry run (no publishing)'
        default: 'false'
        required: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate blog post
        env:
          PYTHONUTF8: "1"
          SHOPIFY_STORE:        ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY_RUN" = "true" ]; then
            python blog_daily.py --count "$COUNT" --dry-run
          else
            python blog_daily.py --count "$COUNT"
          fi

      - name: Upload blog generation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-generation-${{ github.run_number }}
          path: blog_*.json
          if-no-files-found: ignore
          retention-days: 14
