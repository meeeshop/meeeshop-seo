name: MeeeShop SEO Automation

# Schedules
#   daily  -- 6:00 AM UTC every day        -> products/pages/collections/articles added in last 48h
#   weekly -- 8:00 AM UTC every Sunday     -> items added in last 7 days
#
# Manual dispatch: choose daily / weekly / force.
# force splits ALL active products into batches of 150 so no single job
# exceeds ~25 min. Pages, collections, and articles are always fully
# processed (small counts) regardless of batch.
#
# Secrets: only ENCRYPTION_KEY_PRIMARY + ENCRYPTION_KEY_FALLBACK are
# passed to the runner. secrets_manager.py decrypts secrets.enc at
# runtime to obtain SHOPIFY_STORE and SHOPIFY_ACCESS_TOKEN.

on:
  schedule:
    - cron: '0 6 * * *'     # daily  — every day 6:00 AM UTC (1:00 AM EST)
    - cron: '0 8 * * 0'     # weekly — Sunday 8:00 AM UTC (3:00 AM EST)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily    # Last 48 hours
          - weekly   # Last 7 days
          - force    # Full store normalization (all items, batched)
      only_images:
        description: 'Only update image filenames/ALTs (skips titles, descriptions, handles, metafields)'
        required: false
        default: false
        type: boolean
      resource:
        description: 'Resource type to optimize'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - products
          - collections
          - pages
          - blogs
      handle:
        description: 'Filter by a specific handle (product or blog handle) to run on a single resource'
        required: false
        default: ''
        type: string

env:
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  BATCH_SIZE: "150"

permissions:
  contents: read
  actions: read

jobs:

  # -------------------------------------------------------------------
  # Job 1: detect mode + build batch-index array for force mode
  # -------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      batches_json: ${{ steps.build_matrix.outputs.batches_json }}
    steps:
      - name: Detect mode
        id: detect
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.detect.outputs.mode == 'force'

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.mode == 'force'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        if: steps.detect.outputs.mode == 'force'
        run: pip install -r requirements.txt

      - name: Build batch matrix
        id: build_matrix
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          MODE="${{ steps.detect.outputs.mode }}"
          RESOURCE="${{ github.event.inputs.resource || 'all' }}"
          HANDLE="${{ github.event.inputs.handle }}"
          
          if [ -n "$HANDLE" ]; then
            echo "batches_json=[{\"resource\":\"$RESOURCE\",\"batch_index\":0}]" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "force" ]; then
            JSON="["
            FIRST=true
            
            # Add collections if requested/all
            if [ "$RESOURCE" = "all" ] || [ "$RESOURCE" = "collections" ]; then
              JSON+="{\"resource\":\"collections\",\"batch_index\":0}"
              FIRST=false
            fi
            
            # Add pages if requested/all
            if [ "$RESOURCE" = "all" ] || [ "$RESOURCE" = "pages" ]; then
              if [ "$FIRST" = "false" ]; then JSON+=","; fi
              JSON+="{\"resource\":\"pages\",\"batch_index\":0}"
              FIRST=false
            fi
            
            # Add blogs if requested/all
            if [ "$RESOURCE" = "all" ] || [ "$RESOURCE" = "blogs" ]; then
              if [ "$FIRST" = "false" ]; then JSON+=","; fi
              JSON+="{\"resource\":\"blogs\",\"batch_index\":0}"
              FIRST=false
            fi
            
            # Add products if requested/all
            if [ "$RESOURCE" = "all" ] || [ "$RESOURCE" = "products" ]; then
              TOTAL=$(python scripts/count_products.py)
              if [ -z "$TOTAL" ]; then
                echo "Error: Failed to retrieve product count"
                exit 1
              fi
              echo "Active products: $TOTAL"
              BATCHES=$(( (TOTAL + ${{ env.BATCH_SIZE }} - 1) / ${{ env.BATCH_SIZE }} ))
              echo "Batches needed: $BATCHES"
              
              for (( i=0; i<BATCHES; i++ )); do
                if [ "$FIRST" = "false" ]; then JSON+=","; fi
                JSON+="{\"resource\":\"products\",\"batch_index\":$i}"
                FIRST=false
              done
            fi
            
            JSON+="]"
            echo "batches_json=$JSON" >> "$GITHUB_OUTPUT"
          else
            echo "batches_json=[{\"resource\":\"$RESOURCE\",\"batch_index\":0}]" >> "$GITHUB_OUTPUT"
          fi

  seo_optimize:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1  # Sequential execution to avoid Shopify API rate limits
      matrix:
        include: ${{ fromJson(needs.setup.outputs.batches_json) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous SEO update log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding latest successful run of MeeeShop SEO Automation..."
          RUN_ID=$(gh run list --workflow "seo_daily.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ]; then
            echo "Found run ID: $RUN_ID"
            echo "Listing artifacts for run $RUN_ID..."
            ARTIFACT_NAME=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name | startswith("seo-log-")) | .name' 2>/dev/null | head -n 1 || echo "")
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "Downloading artifact: $ARTIFACT_NAME"
              gh run download "$RUN_ID" -n "$ARTIFACT_NAME" --dir tmp_download 2>/dev/null || true
              if [ -f "tmp_download/seo_update_log.json" ]; then
                cp tmp_download/seo_update_log.json ./seo_update_log.json
                echo "Successfully restored seo_update_log.json"
              else
                echo "seo_update_log.json not found in downloaded folder"
              fi
            else
              echo "No seo-log artifact found for run $RUN_ID"
            fi
          else
            echo "No successful previous runs found or API access limited."
          fi

      - name: Run SEO automation
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          ONLY_IMAGES: ${{ github.event.inputs.only_images }}
          HANDLE: ${{ github.event.inputs.handle }}
        run: |
          MODE="${{ needs.setup.outputs.mode }}"
          echo "Running SEO automation in $MODE mode for ${{ matrix.resource }} (batch index ${{ matrix.batch_index }})..."
          
          CMD="python scripts/seo_daily.py --${MODE} --batch-size ${{ env.BATCH_SIZE }} --batch-index ${{ matrix.batch_index }} --resource ${{ matrix.resource }}"
          if [ "$ONLY_IMAGES" = "true" ]; then
            CMD="$CMD --only-images"
          fi
          if [ -n "$HANDLE" ]; then
            CMD="$CMD --handle \"$HANDLE\""
          fi
          
          eval $CMD

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ needs.setup.outputs.mode }}-${{ matrix.resource }}-b${{ matrix.batch_index }}-run${{ github.run_number }}
          path: seo_report_*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload SEO log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-log-${{ needs.setup.outputs.mode }}-${{ matrix.resource }}-b${{ matrix.batch_index }}-run${{ github.run_number }}
          path: seo_update_log.json
          retention-days: 30
