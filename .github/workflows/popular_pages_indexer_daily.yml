name: Popular Pages Indexer (Trending Search Re-Indexing)

on:
  # 1. Scheduled — daily at 10:00 AM EST (15:00 UTC)
  schedule:
    - cron: '0 15 * * *'

  # 2. Manual dispatch
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of popular pages to process'
        default: '30'
        required: false
        type: string
      days:
        description: 'Search analytics lookback window in days'
        default: '14'
        required: false
        type: string

jobs:
  popular_indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Popular Pages Indexer
        env:
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '30' }}"
          DAYS="${{ github.event.inputs.days || '14' }}"
          echo "Running popular pages indexer (limit=$LIMIT, days=$DAYS)..."
          python scripts/popular_pages_indexer.py --limit $LIMIT --days $DAYS
