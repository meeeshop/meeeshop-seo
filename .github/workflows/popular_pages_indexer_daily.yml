name: Popular Pages & Search Query Indexer

on:
  # 1. Scheduled — daily at 10:00 AM EST (15:00 UTC)
  schedule:
    - cron: '0 15 * * *'

  # 2. Manual dispatch
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of popular pages to process'
        default: '50'
        required: false
        type: string
      query_limit:
        description: 'Number of top search queries to retrieve and log'
        default: '50'
        required: false
        type: string
      days:
        description: 'Search analytics lookback window in days'
        default: '14'
        required: false
        type: string
      generate_blogs:
        description: 'Generate long-tail blog articles for question queries'
        default: 'true'
        required: false
        type: string
      max_blogs:
        description: 'Maximum number of blog articles to generate per run'
        default: '1'
        required: false
        type: string

jobs:
  popular_indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Popular Pages & Search Query Indexer
        env:
          PYTHONUTF8: "1"
          PYTHONUNBUFFERED: "1"
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '50' }}"
          QUERY_LIMIT="${{ github.event.inputs.query_limit || '50' }}"
          DAYS="${{ github.event.inputs.days || '14' }}"
          GENERATE_BLOGS="${{ github.event.inputs.generate_blogs || 'true' }}"
          MAX_BLOGS="${{ github.event.inputs.max_blogs || '1' }}"
          
          ARGS="--limit $LIMIT --query-limit $QUERY_LIMIT --days $DAYS --max-blogs $MAX_BLOGS"
          if [ "$GENERATE_BLOGS" = "true" ] || [ "$GENERATE_BLOGS" = "True" ]; then
            ARGS="$ARGS --generate-blogs"
          fi
          
          echo "Running popular pages & search query indexer with args: $ARGS"
          python scripts/popular_pages_indexer.py $ARGS

