name: Sitemap & Image Sitemap Submission

on:
  # 1. Scheduled — daily at 9:00 AM EST (14:00 UTC)
  schedule:
    - cron: '0 14 * * *'

  # 2. Manual dispatch with full control
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — log sitemaps only, do not upload or submit to GSC'
        default: 'false'
        required: false
        type: choice
        options: ['false', 'true']

jobs:
  sitemap_submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Sitemap Submissions
        env:
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          echo "Running sitemap generator and submitter script..."
          python scripts/sitemap_generator.py
