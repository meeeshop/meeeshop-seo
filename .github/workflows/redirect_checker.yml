name: Automated 404 Redirect Manager

on:
  schedule:
    # Weekly check on Saturday 11:00 PM UTC (6:00 PM EST)
    - cron: '0 23 * * 6'
  workflow_dispatch:

jobs:
  run_redirects:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Redirect Manager
        env:
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: python scripts/redirect_manager.py
