name: Google Discover Blog Experiment

on:
  schedule:
    # Run 3 times a week: Monday, Wednesday, and Friday at 11:00 AM UTC (US morning readiness)
    - cron: '0 11 * * 1,3,5'
  workflow_dispatch:
    inputs:
      category:
        description: 'Target Blog Category (or "auto" for balanced rotation across all 11 active category channels)'
        required: true
        type: choice
        default: 'auto'
        options:
          - 'auto'
          - 'dresses'
          - 'jeans'
          - 'shirts-tops'
          - 'pants'
          - 'skirts'
          - 'coats-jackets'
          - 'cardigans-sweaters'
          - 'plus-size'
          - 'our-tips'
          - 'womens-clothing'
          - 'veganism'
      draft:
        description: 'Create as a Draft (requires manual review in Shopify Admin before publishing)?'
        required: true
        type: boolean
        default: false
      topic:
        description: 'Custom topic override (leave blank for automatic seasonal & trending topic selection)'
        required: false
        type: string
        default: ''

jobs:
  generate-discover-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Google Discover Blog Generator
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          DECRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          DECRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          CATEGORY: ${{ github.event.inputs.category || 'auto' }}
          DRAFT_MODE: ${{ github.event.inputs.draft || 'false' }}
        run: |
          TOPIC_ARG=""
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_ARG="--topic '${{ github.event.inputs.topic }}'"
          fi
          python scripts/generate_discover_blog.py $TOPIC_ARG
