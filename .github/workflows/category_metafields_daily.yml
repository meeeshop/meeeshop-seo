name: MeeeShop Category Metafields Automation

on:
  schedule:
    - cron: '0 4 * * *'     # daily  — every day 4:00 AM UTC
    - cron: '0 5 * * 0'     # weekly — Sunday 5:00 AM UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Execution action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - diagnose
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - force
      handle:
        description: 'Collection or Product handle (optional, e.g. judy-blue-womens-jeans)'
        required: false
        default: ''
        type: string
      query:
        description: 'Shopify search query (optional, overrides mode, e.g. product_type:Handbags)'
        required: false
        default: ''
        type: string

env:
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  BATCH_SIZE: "20"

jobs:

  # -------------------------------------------------------------------
  # Job 1: detect mode + build batch-index array for force mode
  # -------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      batches_json: ${{ steps.build_matrix.outputs.batches_json }}
    steps:
      - name: Detect mode
        id: detect
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Build batch matrix
        id: build_matrix
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          MODE="${{ steps.detect.outputs.mode }}"
          if [ "$MODE" = "force" ]; then
            TOTAL=$(python scripts/count_products.py)
            echo "Active products: $TOTAL"
            BATCHES=$(( (TOTAL + ${{ env.BATCH_SIZE }} - 1) / ${{ env.BATCH_SIZE }} ))
            echo "Batches needed: $BATCHES"
            JSON="["
            for (( i=0; i<BATCHES; i++ )); do
              [ $i -gt 0 ] && JSON+=","
              JSON+="$i"
            done
            JSON+="]"
            echo "batches_json=$JSON" >> "$GITHUB_OUTPUT"
          else
            echo 'batches_json=[0]' >> "$GITHUB_OUTPUT"
          fi

  # -------------------------------------------------------------------
  # Job 2: Process Category Metafields (Matrix execution if force)
  # -------------------------------------------------------------------
  category_metafields:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch_index: ${{ fromJson(needs.setup.outputs.batches_json) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous metadata log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding latest successful run of MeeeShop Category Metafields Automation..."
          RUN_ID=$(gh run list --workflow "category_metafields_daily.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Found run ID: $RUN_ID"
            echo "Listing artifacts for run $RUN_ID..."
            ARTIFACT_NAME=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name | startswith("metadata-log-")) | .name' | head -n 1)
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "Downloading artifact: $ARTIFACT_NAME"
              gh run download "$RUN_ID" -n "$ARTIFACT_NAME" --dir tmp_download
              if [ -f "tmp_download/category_metafields_log.json" ]; then
                cp tmp_download/category_metafields_log.json ./category_metafields_log.json
                echo "Successfully restored category_metafields_log.json"
              else
                echo "category_metafields_log.json not found in downloaded folder"
              fi
            else
              echo "No metadata-log artifact found for run $RUN_ID"
            fi
          else
            echo "No successful previous runs found."
          fi

      - name: Run Category Metafields Automation
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          # Build arguments array
          ARGS=()
          
          # Action
          if [ "${{ github.event.inputs.action }}" = "diagnose" ]; then
            ARGS+=("--diagnose")
          else
            ARGS+=("--apply")
          fi
          
          # Mode/Scope
          MODE="${{ needs.setup.outputs.mode }}"
          if [ -n "${{ github.event.inputs.query }}" ]; then
            # Query overrides other scopes
            ARGS+=("--query" "${{ github.event.inputs.query }}")
          elif [ -n "${{ github.event.inputs.handle }}" ]; then
            # Handle overrides other scopes
            ARGS+=("--handle" "${{ github.event.inputs.handle }}")
          elif [ "$MODE" = "force" ]; then
            ARGS+=("--full")
            ARGS+=("--batch-size" "${{ env.BATCH_SIZE }}" "--batch-index" "${{ matrix.batch_index }}")
          elif [ "$MODE" = "weekly" ]; then
            ARGS+=("--weekly")
          else
            ARGS+=("--daily")
          fi
          
          echo "Running automate_category_metafields.py ${ARGS[@]}..."
          python scripts/automate_category_metafields.py "${ARGS[@]}"

      - name: Upload backup or preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: category-metafields-${{ needs.setup.outputs.mode }}-b${{ matrix.batch_index }}-run${{ github.run_number }}
          path: |
            shopify_metafields_backup.json
            category_metafields_preview.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload metadata log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-log-${{ needs.setup.outputs.mode }}-b${{ matrix.batch_index }}-run${{ github.run_number }}
          path: category_metafields_log.json
          retention-days: 30
