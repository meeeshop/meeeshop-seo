name: Send Weekly Shopify Email

on:
  schedule:
    - cron: '0 14 * * 3' # Runs Wednesdays at 14:00 UTC
  workflow_dispatch:
    inputs:
      test_email_address:
        description: 'Test email address (leave blank for production run)'
        required: false
        default: ''

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Run email dispatcher
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          TEST_EMAIL: ${{ github.event.inputs.test_email_address }}
        run: python send_weekly_email.py