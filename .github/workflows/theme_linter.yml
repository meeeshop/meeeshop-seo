name: Theme Linter

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  theme_check:
    name: Shopify Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
