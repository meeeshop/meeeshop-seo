name: Generate Google Discover Blogposts

on:
  schedule:
    - cron: '0 8 * * 1,3,5'  # Runs at 08:00 UTC on Mon, Wed, Fri
  workflow_dispatch:

jobs:
  generate-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./meeeshop-blog/requirements.txt
          pip install requests Pillow pip-system-certs

      - name: Validate Secrets (debug safe)
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          echo "🔍 Checking environment setup..."
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY missing"
            exit 1
          fi
          if [ -z "$SHOPIFY_STORE" ]; then
            echo "❌ SHOPIFY_STORE missing"
            exit 1
          fi
          if [ -z "$SHOPIFY_TOKEN" ]; then
            echo "❌ SHOPIFY_ACCESS_TOKEN missing"
            exit 1
          fi
          echo "✅ All secrets present"

      - name: Generate and Publish Blogpost
        shell: bash
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          echo "🚀 Starting blog generation and publishing pipeline..."
          python meeeshop-seo/blog_daily.py --count 3