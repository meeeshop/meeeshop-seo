name: Google Indexing API

# ─────────────────────────────────────────────────────────────────
# Submits newly published Shopify blog articles (and optionally
# products) to the Google Indexing API within hours of publication.
#
# Triggers:
#   1. Automatically after blog_daily.yml completes (chain trigger)
#   2. Daily cron at 9 AM EST — catches any articles published overnight
#   3. Manual dispatch — with configurable options
#
# Required GitHub Secret:
#   GOOGLE_SA_KEY_JSON  — full contents of the service account .json
#                         key file (paste entire JSON as one secret)
#
# See GOOGLE_INDEXING_SETUP.md for one-time setup instructions.
# ─────────────────────────────────────────────────────────────────

on:
  # 1. Auto-trigger after blog generation finishes
  workflow_run:
    workflows: ["Blog Daily Generator"]
    types: [completed]

  # 2. Daily cron — 9 AM EST (14:00 UTC) on blog-publishing days
  schedule:
    - cron: '30 13 * * 2'  # Tuesday  8:30 AM EST  (30 min after blog posts)
    - cron: '30 13 * * 4'  # Thursday 8:30 AM EST
    - cron: '30 14 * * 6'  # Saturday 9:30 AM EST

  # 3. Manual trigger with options
  workflow_dispatch:
    inputs:
      days:
        description: 'Lookback window in days (how far back to find articles)'
        default: '1'
        required: false
      include_products:
        description: 'Also index product pages? (true/false)'
        default: 'false'
        required: false
      dry_run:
        description: 'Dry run — print URLs only, no API calls (true/false)'
        default: 'false'
        required: false
      limit:
        description: 'Max URLs to submit (Google quota: 200/day)'
        default: '200'
        required: false

jobs:
  index-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only run if triggered manually, by cron, OR if the blog workflow succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Submit URLs to Google Indexing API
        env:
          PYTHONUTF8: "1"
          # Encryption keys for secrets_manager (Shopify token, store URL)
          ENCRYPTION_KEY_PRIMARY:  ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
          # Google Service Account — paste entire .json file content here
          GOOGLE_SA_KEY_JSON: ${{ secrets.GOOGLE_SA_KEY_JSON }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          PRODUCTS="${{ github.event.inputs.include_products || 'false' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          LIMIT="${{ github.event.inputs.limit || '200' }}"

          ARGS="--days $DAYS --limit $LIMIT"

          if [ "$PRODUCTS" = "true" ]; then
            ARGS="$ARGS --products"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi

          echo "Running: python scripts/google_indexing.py $ARGS"
          python scripts/google_indexing.py $ARGS

      - name: Upload indexing log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-indexing-${{ github.run_number }}
          path: google_indexing_*.json
          if-no-files-found: ignore
          retention-days: 14
