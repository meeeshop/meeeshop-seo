name: Daily Blog Refresher

on:
  schedule:
    - cron: '0 14 * * *'   # Daily at 9 AM EST (14:00 UTC)
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles (default 0 for all)'
        default: '0'
        required: false
      dry_run:
        description: 'Dry run — print plan only, no Shopify writes (true/false)'
        default: 'false'
        required: false
      article_id:
        description: 'Refresh ONE specific article by Shopify article ID'
        default: ''
        required: false

env:
  PYTHONUTF8: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  refresh_blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh blog posts
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '0' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          ARTICLE_ID="${{ github.event.inputs.article_id || '' }}"

          ARGS="--limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$ARTICLE_ID" ]; then
            ARGS="$ARGS --article-id $ARTICLE_ID"
          fi

          echo "Running: python scripts/modify_blog.py $ARGS"
          python scripts/modify_blog.py $ARGS

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-refresh-daily-run${{ github.run_number }}
          path: modify_blog_*.json
          if-no-files-found: ignore
          retention-days: 14
