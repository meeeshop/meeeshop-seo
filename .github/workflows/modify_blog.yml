name: Weekly Blog Refresher

on:
  schedule:
    - cron: '0 14 * * 0'  # Sunday 9 AM EST (14:00 UTC) — weekly, before the week starts
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max articles to refresh (default 5; use 1 or 2 for a test run)'
        default: '5'
        required: false
      dry_run:
        description: 'Dry run — print plan only, no Shopify writes (true/false)'
        default: 'false'
        required: false
      article_id:
        description: 'Refresh ONE specific article by Shopify article ID (leave blank for batch)'
        default: ''
        required: false

jobs:
  refresh-blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh blog posts
        env:
          PYTHONUTF8: "1"
          SHOPIFY_STORE:        ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '5' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"
          ARTICLE_ID="${{ github.event.inputs.article_id || '' }}"

          ARGS="--limit $LIMIT"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$ARTICLE_ID" ]; then
            ARGS="$ARGS --article-id $ARTICLE_ID"
          fi

          echo "Running: python scripts/modify_blog.py $ARGS"
          python scripts/modify_blog.py $ARGS

      - name: Upload refresh log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-refresh-${{ github.run_number }}
          path: modify_blog_*.json
          if-no-files-found: ignore
          retention-days: 14
