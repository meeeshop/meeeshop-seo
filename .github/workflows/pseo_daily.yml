name: pSEO Occasion Hubs Generator

on:
  schedule:
    - cron: '0 3 */3 * *'  # Runs every 3 days at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pseo-generator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests cryptography

      - name: Run pSEO Generator
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          python scripts/pseo_collection_generator.py
