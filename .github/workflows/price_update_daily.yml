name: MeeeShop Price Update

# Schedules
#   daily  -- 7:00 AM UTC every day        -> products added in last 48h
#   weekly -- 8:00 AM UTC every Sunday     -> products added in last 7d
#
# Manual dispatch: choose daily / weekly / force.
# force splits ALL active products into batches of 150 so no single job
# exceeds ~25 min (well under GitHub's 6-hour job limit).
#
# Secrets: only ENCRYPTION_KEY_PRIMARY + ENCRYPTION_KEY_FALLBACK are
# passed to the runner. secrets_manager.py decrypts secrets.enc at
# runtime to obtain SHOPIFY_STORE and SHOPIFY_ACCESS_TOKEN.

on:
  schedule:
    - cron: '0 7 * * *'     # daily  — every day 7:00 AM UTC
    - cron: '0 8 * * 0'     # weekly — Sunday 8:00 AM UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - force
      window:
        description: 'Fetch window in hours (optional, overrides default). e.g. 12 = products added in last 12h only'
        required: false
        default: ''
        type: string

env:
  PYTHONUTF8: "1"
  PYTHON_VERSION: "3.12"
  BATCH_SIZE: "150"

jobs:

  # -------------------------------------------------------------------
  # Job 1: detect mode + build batch-index array for force mode
  # -------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      batches_json: ${{ steps.build_matrix.outputs.batches_json }}
    steps:
      - name: Detect mode
        id: detect
        run: |
          INPUT_MODE="${{ github.event.inputs.mode }}"
          if [ -n "$INPUT_MODE" ]; then
            echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.detect.outputs.mode == 'force'

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.mode == 'force'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install deps
        if: steps.detect.outputs.mode == 'force'
        run: pip install -r requirements.txt

      - name: Count products and build batch array
        id: build_matrix
        if: steps.detect.outputs.mode == 'force'
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          TOTAL=$(python scripts/count_products.py)
          echo "Active products: $TOTAL"
          BATCHES=$(( (TOTAL + ${{ env.BATCH_SIZE }} - 1) / ${{ env.BATCH_SIZE }} ))
          echo "Batches needed: $BATCHES"
          JSON="["
          for (( i=0; i<BATCHES; i++ )); do
            [ $i -gt 0 ] && JSON+=","
            JSON+="$i"
          done
          JSON+="]"
          echo "batches_json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Set dummy batches (non-force)
        if: steps.detect.outputs.mode != 'force'
        run: echo 'batches_json=[0]' >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------
  # Job 2a: daily or weekly — single job
  # -------------------------------------------------------------------
  price_update:
    needs: setup
    if: needs.setup.outputs.mode != 'force'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download previous price update log
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Finding latest successful run of MeeeShop Price Update..."
          RUN_ID=$(gh run list --workflow "price_update_daily.yml" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$RUN_ID" ]; then
            echo "Found run ID: $RUN_ID"
            echo "Listing artifacts for run $RUN_ID..."
            ARTIFACT_NAME=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts --jq '.artifacts[] | select(.name | startswith("price-log-")) | .name' | head -n 1)
            if [ -n "$ARTIFACT_NAME" ]; then
              echo "Downloading artifact: $ARTIFACT_NAME"
              gh run download "$RUN_ID" -n "$ARTIFACT_NAME" --dir tmp_download
              if [ -f "tmp_download/price_update_log.json" ]; then
                cp tmp_download/price_update_log.json ./price_update_log.json
                echo "Successfully restored price_update_log.json"
              else
                echo "price_update_log.json not found in downloaded folder"
              fi
            else
              echo "No price-log artifact found for run $RUN_ID"
            fi
          else
            echo "No successful previous runs found."
          fi

      - name: Run price update
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          WINDOW="${{ github.event.inputs.window }}"
          if [ -n "$WINDOW" ]; then
            python scripts/price_update.py --mode ${{ needs.setup.outputs.mode }} --window "$WINDOW"
          else
            python scripts/price_update.py --mode ${{ needs.setup.outputs.mode }}
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-log-${{ needs.setup.outputs.mode }}-run${{ github.run_number }}
          path: price_update_log.json
          retention-days: 30

  # -------------------------------------------------------------------
  # Job 2b: force — matrix of batch jobs, sequential
  # -------------------------------------------------------------------
  price_update_force:
    needs: setup
    if: needs.setup.outputs.mode == 'force'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch_index: ${{ fromJson(needs.setup.outputs.batches_json) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price update (batch ${{ matrix.batch_index }})
        env:
          ENCRYPTION_KEY_PRIMARY: ${{ secrets.ENCRYPTION_KEY_PRIMARY }}
          ENCRYPTION_KEY_FALLBACK: ${{ secrets.ENCRYPTION_KEY_FALLBACK }}
        run: |
          python scripts/price_update.py \
            --mode force \
            --batch-size ${{ env.BATCH_SIZE }} \
            --batch-index ${{ matrix.batch_index }}

      - name: Upload batch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-log-force-b${{ matrix.batch_index }}-run${{ github.run_number }}
          path: price_update_log.json
          retention-days: 30
