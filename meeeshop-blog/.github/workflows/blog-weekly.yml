name: MeeeShop Blog — AI Posts (Mon/Wed/Fri)

on:
  schedule:
    - cron: '0 10 * * 1'   # Monday    6 AM EST
    - cron: '0 10 * * 3'   # Wednesday 6 AM EST
    - cron: '0 10 * * 5'   # Friday    6 AM EST
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blog posts to generate'
        required: false
        default: '3'
        type: choice
        options: ['1', '2', '3']
      dry_run:
        description: 'Dry run (generate only, do not publish)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  generate_posts:
    name: Generate Blog Posts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and publish blog posts
        env:
          SHOPIFY_STORE:        ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '3' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            python blog_daily.py --count "$COUNT" --dry-run 2>&1 | tee blog_run.log
          else
            python blog_daily.py --count "$COUNT" 2>&1 | tee blog_run.log
          fi

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-log-${{ github.run_number }}
          path: blog_run.log
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## Blog Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "Run: ${{ github.run_number }} | Triggered: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f blog_run.log ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -10 blog_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
